name: game
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - /opt/game/volumes/api:/app/data
    stop_grace_period: 30s
